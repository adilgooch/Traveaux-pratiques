<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercices 13 à 15</title>
  <style>
    body {
      --page: #f4f7fb;
      --card: #ffffff;
      --text: #182434;
      --soft: #e2eaff;
      margin: 0;
      padding: 24px;
      background: var(--page);
      color: var(--text);
      font-family: Arial, sans-serif;
      transition: background-color .2s, color .2s;
    }
    body.dark {
      --page: #111820;
      --card: #1b2631;
      --text: #eef3f8;
      --soft: #354454;
    }
    main { 
      max-width: 760px; 
      margin: auto; }
    section {
       margin-bottom: 20px; 
       padding: 20px; 
       border-radius: 16px; 
       background: var(--card); 
       box-shadow: 0 4px 12px #18243414; }
    button { 
      padding: 9px 14px; 
      border: 1px solid #657386;
      border-radius: 8px; 
      background: #91aaff; 
      color: #182434; 
      font-size: 16px; 
      cursor: pointer; }
    .bar { 
      height: 24px; 
      margin: 12px 0; 
      overflow: hidden; 
      border-radius: 20px; 
      background: var(--soft); }
    #fill { 
      width: 0; 
      height: 100%; 
      background: #8ee1b2; 
      transition: width .25s; }
    .zones { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 16px; }
    .zone { 
      display: grid; 
      place-items: center; 
      width: 220px; 
      min-height: 140px; 
      padding: 12px; 
      border: 2px dashed #657386; 
      border-radius: 12px; 
      background: var(--soft); }
    #item { 
      padding: 14px; 
      border-radius: 8px; 
      background: #91aaff; 
      color: #182434; 
      cursor: grab; }
  </style>
</head>
<body>
  <main>
    <h1>Exercices JavaScript 13 à 15</h1>

    <section>
      <h2>13. Barre de progression</h2>
      <div class="bar">
        <div id="fill"></div>
      </div>
      <p id="percent">0 %</p>
      <button id="advance">Avancer</button>
    </section>

    <section>
      <h2>14. Glisser-déposer</h2>
      <p>Glisse le petit bloc d’une zone vers l’autre.</p>
      <div class="zones">
        <div class="zone" id="zone1">
          <div id="item" draggable="true">Déplace-moi</div>
        </div>
        <div class="zone" id="zone2">Dépose ici</div>
      </div>
    </section>

    <section>
      <h2>15. Thème clair ou sombre</h2>
      <button id="themeBtn">Changer le thème</button>
    </section>
  </main>

  <script src="13-15.js">
  </script>
</body>
</html>
