<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercices 10 à 12</title>
  <style>
    body { margin: 0; 
      padding: 24px;
       background: #f4f7fb; 
       color: #182434; 
       font-family: Arial, sans-serif; }
    main { 
      max-width: 760px; 
      margin: auto; }
    section { margin-bottom: 20px; 
      padding: 20px; 
      border-radius: 16px; 
      background: white; 
      box-shadow: 0 4px 12px #18243414; }
    button, input { 
      padding: 9px; 
      font-size: 16px; 
    }
    button { border: 1px solid #354454; 
      border-radius: 8px; 
      background: #91aaff; 
      cursor: pointer; }
    .modal { 
      position: fixed; 
      inset: 0; 
      display: grid; 
      place-items: center; 
      padding: 20px; 
      background: #18243499; }
    .modal[hidden] { display: none; }
    .modal-box { 
      width: min(400px, 100%); 
      padding: 24px; 
      border-radius: 16px; 
      background: white; 
      box-shadow: 0 8px 24px #0003; }
    #products { padding-left: 22px; }
    #products li { margin: 8px 0; }
    .layout { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 12px; }
    .layout div { 
      padding: 18px; 
      border-radius: 10px; 
      background: #e2eaff; }
    .layout.small { 
      grid-template-columns: 1fr; }
  </style>
</head>
<body>
  <main>
    <h1>Exercices JavaScript 10 à 12</h1>

    <section>
      <h2>10. Modale de notification</h2>
      <button id="open">Ouvrir</button>
      <div class="modal" id="modal" hidden>
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
          <h3 id="modalTitle">Notification</h3>
          <p>Voici un message dans la fenêtre.</p>
          <button id="close">Fermer</button>
        </div>
      </div>
    </section>

    <section>
      <h2>11. Filtrage de tableau</h2>
      <label for="search">Chercher un produit :</label>
      <input id="search" type="text" placeholder="Exemple : pomme">
      <ul id="products">
        <li>Pomme</li>
        <li>Banane</li>
        <li>Orange</li>
        <li>Pain</li>
        <li>Lait</li>
      </ul>
    </section>

    <section>
      <h2>12. Changement selon la largeur</h2>
      <p id="screenInfo"></p>
      <div class="layout" id="layout">
        <div>Bloc un</div>
        <div>Bloc deux</div>
      </div>
    </section>
  </main>
adul>lutton_adi;
  <script src="10-12.js">
  </script>
</body>
</html>
