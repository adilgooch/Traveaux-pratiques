            margin-bottom:15px;
        }

            padding: 5px;
        }
    </style>
</head>
<body>

            <label for="minute1">minute(s):</label>

            <label for="seconde2">seconde(s):</label>

        <button type="button" id="btn-calculate">Clacule</button>
        <div>
            <p>Total temps=></p>
            <label for="jour">jour(s):</label>

            <input type="number" id="minute" value="">

    </form>
    <script src="somme.js"></script>
